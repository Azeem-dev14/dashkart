name: dashkart
description: "DashKart — an original arcade kart racer for Android and iOS."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0
  # flutter_scene renders through Flutter GPU, which needs 3.47 or newer.
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter

  # --- State management ------------------------------------------------------
  # Every ChangeNotifier (PlayerState, GameSettings, RaceController) is exposed
  # through a ChangeNotifierProvider rather than the old hand-rolled
  # InheritedNotifier — same notifier classes, compile-safe lookup via `ref`.
  flutter_riverpod: ^2.6.1

  # --- 3D race scene -------------------------------------------------------
  # Pinned exactly, not with a caret: flutter_scene is pre-1.0 and documents
  # that minor releases can carry breaking changes. Bump deliberately.
  flutter_scene: 0.22.2
  flutter_scene_rapier: 0.5.0   # physics, shares flutter_scene's contract
  vector_math: ^2.2.0

  # --- Audio ---------------------------------------------------------------
  # SoLoud is used over audioplayers for its low latency and, critically, for
  # runtime pitch shifting — the engine loop is pitched by RPM.
  flutter_soloud: ^4.1.7

  # --- UI ------------------------------------------------------------------
  flutter_svg: ^2.3.0           # Kenney UI/icon/control assets ship as SVG
  shared_preferences: ^2.5.5    # settings, progress, unlocks

  cupertino_icons: ^1.0.8

  # --- Multiplayer -----------------------------------------------------------
  # Realtime Database, not Firestore: room state is small and changes a lot
  # (steering position at ~10Hz per racer), which is what RTDB is built for.
  firebase_core: ^4.14.0
  firebase_database: ^12.5.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Used by hook/build.dart, the asset build hook flutter_scene:init writes.
  hooks: ^2.0.2

# Fonts are vendored rather than pulled through the google_fonts package, which
# downloads over HTTP on first launch — the splash screen must render correctly
# offline and on a cold first run. All three are SIL OFL 1.1; license texts are
# in docs/licenses/ and shown on Settings ▸ Licenses.

flutter:
  uses-material-design: true

  # Every directory below is pruned to exactly what lib/ references. Adding an
  # asset means adding it here and using it — there is no bulk-import bucket.
  assets:
    # Generated by flutter_scene's build hook (.glb → .fsceneb, textures → .fstex).
    # Added by `dart run flutter_scene:init`; contents are gitignored.
    - flutter_scene_generated/

    # --- 3D ---------------------------------------------------------------
    - assets/models/karts/          # 3 kart bodies + 3 wheel sets (Kenney Car Kit)
    - assets/models/characters/     # 3 rigged racers + 2 accessories
    - assets/models/tracks/         # the one modular road piece the circuit tiles
    - assets/models/environment/    # barrier + the 8 trackside props

    # --- UI ---------------------------------------------------------------
    - assets/images/splash/              # company / studio splash screens
    - assets/images/ui/controls/         # driving controls + pressed states (SVG)
    - assets/images/ui/icons/            # primary icon family (SVG)
    - assets/images/ui/icons-raster/     # gap-fill icons, tinted (PNG)

    # --- Audio ------------------------------------------------------------
    - assets/audio/music/
    - assets/audio/music/jingles/
    - assets/audio/sfx/digital/
    - assets/audio/sfx/scifi/
    - assets/audio/sfx/engine/
    - assets/audio/sfx/ui/
    - assets/audio/voice/

  fonts:
    # Brand face — wordmark, countdown, position. Single weight by design.
    - family: TitanOne
      fonts:
        - asset: assets/fonts/TitanOne-Regular.ttf

    # UI face — every heading, button, label, and body string.
    # Variable (wght 300–700, wdth); Flutter selects instances via FontVariation.
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-VariableFont.ttf

    # Numeric face — speed, lap, timers, stat values.
    - family: ChakraPetch
      fonts:
        - asset: assets/fonts/ChakraPetch-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ChakraPetch-Bold.ttf
          weight: 700
        - asset: assets/fonts/ChakraPetch-BoldItalic.ttf
          weight: 700
          style: italic

    # Action button face — official font used in Brawl Stars UI
    - family: LilitaOne
      fonts:
        - asset: assets/fonts/LilitaOne-Regular.ttf

